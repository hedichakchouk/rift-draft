name: Refresh meta (lolalytics + guides)
on:
  schedule:
    - cron: '23 5 * * 3'   # every Wednesday morning (patches land on Wednesdays)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch meta
        run: node scripts/fetch-meta.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "hach-draft-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/meta
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else git commit -m "Refresh meta data" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Redeploy the site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
